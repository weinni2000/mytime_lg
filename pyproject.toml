[tool.ruff]
target-version = "py310"
fix = true

[tool.ruff.lint]
extend-select = [
    "B",
    "C90",
    "E501",  # line too long (default in `ruff format`)
    "I",  # isort
    "UP",  # pyupgrade
]
exclude = ["setup/*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"__manifest__.py" = ["B018"]

[tool.ruff.format]
exclude = ["setup/*"]
